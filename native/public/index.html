<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alpha Workspace</title>
<!--
  The shell navigates straight to the live origin, so this file is only ever
  seen if the app launches with no connection AND the service worker has never
  cached anything (a first run offline). It is deliberately one file with no
  assets, so it cannot itself fail to load.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 2rem; text-align: center;
    background: #fbfaf2; color: #0b1215;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1215; color: #fbfaf2; } }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; letter-spacing: -0.02em; }
  p { margin: 0; opacity: .7; max-width: 22rem; }
</style>
<h1>No connection</h1>
<p>Alpha Workspace needs a connection the first time it opens. Once it has loaded, your work keeps going offline.</p>
